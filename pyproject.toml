[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quizpublish"
version = "0.1.0"
description = "AI quiz generation + multi-provider form publishing SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "QuizPublish contributors" }]
dependencies = [
  "openai>=1.0",
  "pydantic>=2.0",
  "google-api-python-client>=2.0",
  "google-auth>=2.0",
]

[project.optional-dependencies]
dev = ["streamlit", "python-dotenv", "google-auth-oauthlib"]

[tool.setuptools.packages.find]
include = ["quizpublish*"]
